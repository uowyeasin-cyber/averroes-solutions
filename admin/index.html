<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Averroes Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../img/me-averroes-logo.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Hind+Siliguri:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a quiet workspace. Left rail of rooms, one working canvas, a drawer for editing one page. */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --sunken:#eceef4; --line:#e0e3ec;
  --ink:#0e1430; --ink-2:#4a5170; --ink-3:#868ca5;
  --brand:#1f3fd8; --brand-ink:#fff; --brand-soft:#e7ebfc;
  --good:#0f8a5f; --good-soft:#e2f4ec; --warn:#b25e09; --warn-soft:#fbefdf; --bad:#c9302a; --bad-soft:#fbe6e4;
  --rail:#0e1430; --rail-ink:#eef0fb; --rail-2:#9aa1c4;
  --shadow:0 1px 2px rgba(14,20,48,.05),0 8px 24px rgba(14,20,48,.07);
  --display:"Bricolage Grotesque","Hind Siliguri",system-ui,sans-serif; --body:"Inter","Hind Siliguri",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e22; --surface:#121834; --sunken:#181f40; --line:#252d55; --ink:#eef0fb; --ink-2:#b4bad6; --ink-3:#7c84a8;
  --brand:#6f8bff; --brand-ink:#0a0e22; --brand-soft:#1a2352; --good:#39c48d; --good-soft:#0f2a22; --warn:#f0a548; --warn-soft:#2c210f; --bad:#ff6b61; --bad-soft:#2e1416;
  --rail:#070a1a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e22; --surface:#121834; --sunken:#181f40; --line:#252d55; --ink:#eef0fb; --ink-2:#b4bad6; --ink-3:#7c84a8;
  --brand:#6f8bff; --brand-ink:#0a0e22; --brand-soft:#1a2352; --good:#39c48d; --good-soft:#0f2a22; --warn:#f0a548; --warn-soft:#2c210f; --bad:#ff6b61; --bad-soft:#2e1416;
  --rail:#070a1a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;line-height:1.15}
h1{font-size:28px;font-weight:800}h2{font-size:19px}h3{font-size:16px}
p{margin:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 22px;font:800 17px/1 var(--display)}
.brand small{display:block;font:500 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--rail-2);margin-top:4px;text-transform:uppercase}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--rail-2);font-size:14.5px}
.rail button:hover{color:var(--rail-ink);background:rgba(255,255,255,.05)}
.rail button[aria-current="page"]{background:rgba(111,139,255,.16);color:#fff}
.rail .sp{flex:1}
.rail .who{font-size:12.5px;color:var(--rail-2);padding:8px 12px;overflow:hidden;text-overflow:ellipsis}
main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px 24px}
.bar h1{font-size:20px}
.bar .sp{flex:1}
.state{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.state i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.state.dirty i{background:var(--warn)}
.bar .menuBtn{display:none}
.view{padding:28px 24px 64px;padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;display:grid;gap:24px;align-content:start}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13.5px;padding:10px 24px;border-bottom:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ai{background:linear-gradient(135deg,var(--brand),#7b4dff);border:0;color:#fff}
.btn.ai::before{content:"✦";font-size:13px}
.btn.small{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55;cursor:progress}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px;min-width:0}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink-3);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:4px}
.kpi b{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink-3)}
.ring{--v:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--c,var(--brand)) calc(var(--v)*1%),var(--sunken) 0);display:grid;place-items:center}
.ring b{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 30px/1 var(--display)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--sunken)}
.tablewrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:var(--sunken);color:var(--ink-2)}
.score{font:700 15px/1 var(--display);font-variant-numeric:tabular-nums}

label.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
label.f .row{display:flex;justify-content:space-between;gap:8px}
.count{font:500 11.5px/1 var(--mono);color:var(--ink-3)}
.count.ok{color:var(--good)}.count.over{color:var(--bad)}
input.t,select.t,textarea.t{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:400;color:var(--ink)}
textarea.t{min-height:90px;resize:vertical;line-height:1.5}
input.t:focus,select.t:focus,textarea.t:focus{outline:2px solid var(--brand);outline-offset:-1px}
.serp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;font-family:Arial,sans-serif;display:grid;gap:3px}
.serp .u{font-size:12.5px;color:var(--ink-2)}
.serp .t{font-size:19px;color:#1a0dab;line-height:1.3}
:root[data-theme="dark"] .serp .t{color:#99b4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .serp .t{color:#99b4ff}}
.serp .d{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks li::before{content:"";width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;background:var(--bad-soft);box-shadow:inset 0 0 0 4px var(--bad)}
.checks li.ok::before{background:var(--good);box-shadow:none;-webkit-mask:none}
.aibox{background:var(--brand-soft);border-radius:12px;padding:14px 16px;display:grid;gap:8px;font-size:14px}
.aibox ol{margin:0;padding-left:20px;display:grid;gap:6px}
.opts{display:grid;gap:8px}
.opts button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.opts button:hover{border-color:var(--brand)}

.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.on{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(7,10,26,.45)}
.drawer .body{position:absolute;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drawer .head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .scroll{overflow:auto;padding:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
.drawer .foot{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sec{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.sec .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{all:unset;cursor:pointer;width:40px;height:40px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.seg{display:inline-flex;background:var(--sunken);padding:4px;border-radius:10px;gap:4px}
.seg button{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.kwgroup{display:grid;gap:8px}
.kwgroup h3{font-size:14px;color:var(--ink-2)}
.kw{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 12px;font-size:14px}
.kw span{min-width:0}
.check{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--ink-3);display:grid;gap:12px;justify-items:center}
.setup li{padding:10px 0;border-bottom:1px solid var(--line)}
.setup code{font:500 12.5px var(--mono);background:var(--sunken);padding:2px 6px;border-radius:5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:.25s;pointer-events:none;z-index:90;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--rail)}
.login form{width:min(400px,100%);background:var(--surface);border-radius:18px;padding:30px;display:grid;gap:14px}
.login .err{color:var(--bad);font-size:13.5px;min-height:1.2em}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:250px;z-index:50;transform:translateX(-100%);transition:transform .25s;height:100%}
  .rail.open{transform:none}
  .bar .menuBtn{display:inline-flex}
  .grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .state span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script src="../data/content.js"></script>
<script src="../data/agency.js"></script>
<script src="admin.js"></script>
</body>
</html>
